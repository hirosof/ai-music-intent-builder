name: deploy

env:
    BUILD_TARGET_APP_DIR: "./app"

on:
  # Runs on pushes targeting the `main` branch. Change this to `master` if you're
  # using the `master` branch as the default branch.
  # push:
  #  branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled
      # - uses: pnpm/action-setup@v4 # Uncomment this block if you're using pnpm
      #   with:
      #     version: 9 # Not needed if you've set "packageManager" in package.json
      # - uses: oven-sh/setup-bun@v1 # Uncomment this if you're using Bun
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "${{env.BUILD_TARGET_APP_DIR}}/package-lock.json"
          
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci --prefix "${{env.BUILD_TARGET_APP_DIR}}"
      - name: Application Build
        run: npm run build --prefix "${{env.BUILD_TARGET_APP_DIR}}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "${{env.BUILD_TARGET_APP_DIR}}/dist"

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy (Github Pages)
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Backup instance on Cloudflare Workers (static assets). Reuses the Pages build artifact.
  # Requires repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy (Cloudflare Workers)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Extract build artifact
        run: |
          mkdir -p "${{env.BUILD_TARGET_APP_DIR}}/dist"
          tar -xf "${{ runner.temp }}/pages-artifact/artifact.tar" -C "${{env.BUILD_TARGET_APP_DIR}}/dist"
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{env.BUILD_TARGET_APP_DIR}}
          command: deploy